<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 파비콘 / 앱 아이콘 (.ico 우선 + PNG 고해상 폴백. 기존 favicon.svg는 게임과 무관한 템플릿이라 제거) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- 주소창 색 — src/styles/tokens.css의 --color-pink-700 미러 (HTML meta는 CSS 변수 불가) -->
    <meta name="theme-color" content="#ff3d7f" />

    <title>츄와와 ~뽀뽀 돌격~</title>
    <meta
      name="description"
      content="츄와와의 일편단심 뽀뽀 대작전! 냐냐의 마음을 사로잡을 수 있을까?"
    />

    <!-- Open Graph (카카오톡 / 페이스북 / 디스코드 공유 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="츄와와 ~뽀뽀 돌격~" />
    <meta property="og:title" content="츄와와 ~뽀뽀 돌격~" />
    <meta
      property="og:description"
      content="츄와와의 일편단심 뽀뽀 대작전! 냐냐의 마음을 사로잡을 수 있을까?"
    />
    <meta property="og:url" content="https://chuhuahua-game.vercel.app/" />
    <meta
      property="og:image"
      content="https://chuhuahua-game.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="츄와와 ~뽀뽀 돌격~ 타이틀과 츄와와, 고양이 캐릭터"
    />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="츄와와 ~뽀뽀 돌격~" />
    <meta
      name="twitter:description"
      content="츄와와의 일편단심 뽀뽀 대작전! 냐냐의 마음을 사로잡을 수 있을까?"
    />
    <meta
      name="twitter:image"
      content="https://chuhuahua-game.vercel.app/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
